<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <rect width="600" height="375" fill="#FAF9F6"/>
  <!-- Top Navigation Header -->
  <rect width="600" height="46" fill="#FFFFFF" stroke="#E9E6E0" stroke-width="1"/>
  <!-- Monogram Logo -->
  <text x="28" y="29" fill="#A94F20" font-family="Playfair Display, Georgia, serif" font-size="20" font-weight="bold" font-style="italic">Parag</text>
  <text x="78" y="28" fill="#77736D" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5">THEME</text>

  <!-- Nav links -->
  <text x="240" y="28" fill="#242321" font-family="Inter, sans-serif" font-size="11" font-weight="600">About</text>
  <text x="290" y="28" fill="#77736D" font-family="Inter, sans-serif" font-size="11">Essays</text>
  <text x="345" y="28" fill="#77736D" font-family="Inter, sans-serif" font-size="11">Projects</text>
  <text x="405" y="28" fill="#77736D" font-family="Inter, sans-serif" font-size="11">Reading</text>
  <text x="465" y="28" fill="#77736D" font-family="Inter, sans-serif" font-size="11">Contact</text>

  <rect x="524" y="12" width="50" height="22" rx="4" fill="#A94F20"/>
  <text x="536" y="27" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="600">Talk</text>

  <!-- Editorial Main Layout -->
  <!-- Eyebrow & Headline -->
  <text x="28" y="78" fill="#A94F20" font-family="Inter, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">EDITORIAL MINIMALISM · WORDPRESS THEME</text>

  <text x="28" y="108" fill="#242321" font-family="Playfair Display, Georgia, serif" font-size="24" font-weight="bold">Words, Thoughts &amp; Focused Reading.</text>

  <text x="28" y="130" fill="#77736D" font-family="Inter, sans-serif" font-size="11" leading="1.6">A warm classic theme engineered for personal blogs, technical writing, and portfolios.</text>

  <!-- Featured Article Card (Left) -->
  <g transform="translate(28, 146)">
    <rect width="340" height="185" rx="4" fill="#FFFFFF" stroke="#E9E6E0" stroke-width="1"/>
    <rect width="340" height="95" rx="4" fill="#F5EAE1"/>
    <!-- Decorative mountains illustration in header -->
    <path d="M0,95 L60,45 L130,80 L200,30 L270,75 L340,50 L340,95 Z" fill="#E5D4C3" opacity="0.6"/>
    <path d="M0,95 L90,60 L180,85 L260,55 L340,80 L340,95 Z" fill="#D9C1AA" opacity="0.7"/>

    <text x="16" y="116" fill="#A94F20" font-family="Inter, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">ESSAY · OCT 2024 · 6 MIN READ</text>
    <text x="16" y="136" fill="#242321" font-family="Playfair Display, Georgia, serif" font-size="15" font-weight="bold">The Discipline of Building Quiet Software</text>
    <text x="16" y="156" fill="#77736D" font-family="Inter, sans-serif" font-size="10">How calibrated typography and whitespace create calm digital spaces.</text>
    <text x="16" y="174" fill="#A94F20" font-family="Inter, sans-serif" font-size="10" font-weight="600">Read Article →</text>
  </g>

  <!-- Right Side Column (Recent Notes & Quote) -->
  <g transform="translate(382, 146)">
    <rect width="190" height="88" rx="4" fill="#FFFFFF" stroke="#E9E6E0" stroke-width="1"/>
    <text x="12" y="20" fill="#A94F20" font-family="Inter, sans-serif" font-size="8" font-weight="bold" letter-spacing="1">NOTE · OCT 2024</text>
    <text x="12" y="38" fill="#242321" font-family="Playfair Display, Georgia, serif" font-size="12" font-weight="bold">Simplicity Outlasts Trends</text>
    <text x="12" y="55" fill="#77736D" font-family="Inter, sans-serif" font-size="9">Clean semantic HTML, zero bloat,</text>
    <text x="12" y="68" fill="#77736D" font-family="Inter, sans-serif" font-size="9">and accessible web standards.</text>

    <!-- Warm Quote Callout -->
    <g transform="translate(0, 98)">
      <rect width="190" height="87" rx="4" fill="#F5EAE1" stroke="#E9E6E0" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="87" fill="#A94F20"/>
      <text x="14" y="22" fill="#A94F20" font-family="Playfair Display, Georgia, serif" font-size="18" font-style="italic">“</text>
      <text x="24" y="24" fill="#242321" font-family="Playfair Display, Georgia, serif" font-size="11" font-style="italic">Typography is</text>
      <text x="14" y="42" fill="#242321" font-family="Playfair Display, Georgia, serif" font-size="11" font-style="italic">the visual voice of thought.</text>
      <text x="14" y="68" fill="#77736D" font-family="Inter, sans-serif" font-size="9">— Parag Theme on WP.org</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <rect y="346" width="600" height="29" fill="#FAF9F6" stroke="#E9E6E0" stroke-width="1"/>
  <text x="28" y="365" fill="#77736D" font-family="Inter, sans-serif" font-size="10">Classic WordPress Theme · Live on WordPress.org Theme Directory · 100% Free &amp; Open Source</text>
</svg>