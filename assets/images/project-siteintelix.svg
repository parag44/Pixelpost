<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <rect width="600" height="375" fill="#16181D"/>
  <!-- Window Header -->
  <rect width="600" height="36" fill="#1F232B"/>
  <circle cx="20" cy="18" r="5" fill="#EF4444"/>
  <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="18" r="5" fill="#10B981"/>
  <text x="80" y="22" fill="#E2E8F0" font-family="monospace, sans-serif" font-size="12" font-weight="bold">SiteIntelix — Developer &amp; Admin Toolkit v2.8</text>
  <rect x="470" y="8" width="110" height="20" rx="3" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="483" y="22" fill="#34D399" font-family="monospace, sans-serif" font-size="10" font-weight="bold">SYSTEM HEALTHY</text>

  <!-- Metric Badges Row -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="132" height="44" rx="4" fill="#222630" stroke="#2D3342" stroke-width="1"/>
    <text x="10" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">PHP / ENVIRONMENT</text>
    <text x="10" y="35" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="13" font-weight="bold">PHP 8.2.14 · WP 6.7</text>

    <rect x="142" y="0" width="132" height="44" rx="4" fill="#222630" stroke="#2D3342" stroke-width="1"/>
    <text x="152" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">MEMORY CONSUMPTION</text>
    <text x="152" y="35" fill="#38BDF8" font-family="monospace, sans-serif" font-size="13" font-weight="bold">42.8 MB / 256 MB</text>

    <rect x="284" y="0" width="132" height="44" rx="4" fill="#222630" stroke="#2D3342" stroke-width="1"/>
    <text x="294" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">DATABASE STATUS</text>
    <text x="294" y="35" fill="#34D399" font-family="monospace, sans-serif" font-size="13" font-weight="bold">MySQL 8.0 · 32 Tbls</text>

    <rect x="426" y="0" width="134" height="44" rx="4" fill="#222630" stroke="#2D3342" stroke-width="1"/>
    <text x="436" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">ACTIVE MODULES</text>
    <text x="436" y="35" fill="#FB923C" font-family="monospace, sans-serif" font-size="13" font-weight="bold">FileManager + Diag</text>
  </g>

  <!-- Left Sidebar & Main Diagnostics View -->
  <!-- Left Navigation Menu -->
  <g transform="translate(20, 102)">
    <rect width="120" height="225" rx="4" fill="#1B1E26" stroke="#282D3A" stroke-width="1"/>
    <rect x="6" y="8" width="108" height="24" rx="3" fill="#A94F20"/>
    <text x="16" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">File Manager</text>

    <text x="16" y="54" fill="#94A3B8" font-family="sans-serif" font-size="11">System Health</text>
    <text x="16" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11">DB Optimizer</text>
    <text x="16" y="110" fill="#94A3B8" font-family="sans-serif" font-size="11">Code Snippets</text>
    <text x="16" y="138" fill="#94A3B8" font-family="sans-serif" font-size="11">PHP Info / Logs</text>
    <text x="16" y="166" fill="#94A3B8" font-family="sans-serif" font-size="11">Maintenance</text>

    <rect x="10" y="188" width="100" height="24" rx="3" fill="#222630" stroke="#3E444E" stroke-width="1"/>
    <text x="18" y="204" fill="#E2E8F0" font-family="monospace, sans-serif" font-size="9">+ Export Report</text>
  </g>

  <!-- Right File Manager & Diagnostic Table -->
  <g transform="translate(150, 102)">
    <rect width="430" height="225" rx="4" fill="#1A1D24" stroke="#282D3A" stroke-width="1"/>
    <!-- Table Header -->
    <rect width="430" height="28" rx="4" fill="#222630"/>
    <text x="14" y="18" fill="#94A3B8" font-family="monospace, sans-serif" font-size="10" font-weight="bold">FILE / DIRECTORY</text>
    <text x="190" y="18" fill="#94A3B8" font-family="monospace, sans-serif" font-size="10" font-weight="bold">SIZE</text>
    <text x="260" y="18" fill="#94A3B8" font-family="monospace, sans-serif" font-size="10" font-weight="bold">PERM</text>
    <text x="340" y="18" fill="#94A3B8" font-family="monospace, sans-serif" font-size="10" font-weight="bold">STATUS</text>

    <!-- File 1: wp-config.php -->
    <g transform="translate(0, 32)">
      <text x="14" y="16" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="11">wp-config.php</text>
      <text x="190" y="16" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">4.12 KB</text>
      <text x="260" y="16" fill="#38BDF8" font-family="monospace, sans-serif" font-size="11">0640</text>
      <rect x="336" y="4" width="68" height="16" rx="2" fill="#10B981" fill-opacity="0.15"/>
      <text x="344" y="16" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold">SECURE</text>
    </g>

    <!-- File 2: /wp-content/themes/ -->
    <g transform="translate(0, 64)">
      <rect width="430" height="26" fill="#222630" fill-opacity="0.4"/>
      <text x="14" y="17" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="11">/wp-content/themes/</text>
      <text x="190" y="17" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">14.2 MB</text>
      <text x="260" y="17" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">0755</text>
      <rect x="336" y="5" width="68" height="16" rx="2" fill="#38BDF8" fill-opacity="0.15"/>
      <text x="342" y="17" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">DIR (3)</text>
    </g>

    <!-- File 3: /wp-content/plugins/ -->
    <g transform="translate(0, 96)">
      <text x="14" y="16" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="11">/wp-content/plugins/</text>
      <text x="190" y="16" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">38.9 MB</text>
      <text x="260" y="16" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">0755</text>
      <rect x="336" y="4" width="68" height="16" rx="2" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="340" y="16" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="bold">ACTIVE (8)</text>
    </g>

    <!-- File 4: debug.log -->
    <g transform="translate(0, 128)">
      <rect width="430" height="26" fill="#222630" fill-opacity="0.4"/>
      <text x="14" y="17" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="11">debug.log</text>
      <text x="190" y="17" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">124 KB</text>
      <text x="260" y="17" fill="#38BDF8" font-family="monospace, sans-serif" font-size="11">0644</text>
      <rect x="336" y="5" width="68" height="16" rx="2" fill="#A94F20" fill-opacity="0.2"/>
      <text x="342" y="17" fill="#FB923C" font-family="sans-serif" font-size="9" font-weight="bold">INSPECT</text>
    </g>

    <!-- File 5: .htaccess -->
    <g transform="translate(0, 160)">
      <text x="14" y="16" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="11">.htaccess</text>
      <text x="190" y="16" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">1.1 KB</text>
      <text x="260" y="16" fill="#38BDF8" font-family="monospace, sans-serif" font-size="11">0644</text>
      <rect x="336" y="4" width="68" height="16" rx="2" fill="#10B981" fill-opacity="0.15"/>
      <text x="344" y="16" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold">OPTIMAL</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <rect y="342" width="600" height="33" fill="#1F232B"/>
  <text x="20" y="363" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">Path: /public_html/wp-content/ | Server: LiteSpeed | Diagnostic Mode: Enabled</text>
</svg>