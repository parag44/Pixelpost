<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <rect width="600" height="375" fill="#F8FAFC"/>
  <!-- Top bar -->
  <rect width="600" height="44" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="20" y="12" width="130" height="20" rx="4" fill="#0F172A"/>
  <text x="30" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">WP COMMAND</text>
  <rect x="165" y="10" width="250" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="180" y="26" fill="#64748B" font-family="sans-serif" font-size="11">Search commands... (Press ⌘K)</text>
  <circle cx="560" cy="22" r="12" fill="#E2E8F0"/>

  <!-- Navigation tab pills -->
  <rect x="20" y="60" width="75" height="28" rx="4" fill="#A94F20"/>
  <text x="32" y="78" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Overview</text>
  <rect x="103" y="60" width="75" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="116" y="78" fill="#475569" font-family="sans-serif" font-size="11">Cache Deck</text>
  <rect x="186" y="60" width="75" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="204" y="78" fill="#475569" font-family="sans-serif" font-size="11">Cron Jobs</text>
  <rect x="269" y="60" width="95" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="78" fill="#475569" font-family="sans-serif" font-size="11">DB Optimizations</text>

  <!-- Metric Panels -->
  <g transform="translate(20, 102)">
    <rect width="170" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="15" y="25" fill="#64748B" font-family="sans-serif" font-size="11">OBJECT CACHE</text>
    <text x="15" y="52" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="bold">98.4% Hit</text>
    <text x="15" y="68" fill="#10B981" font-family="sans-serif" font-size="10">Redis v7.2 Connected</text>

    <rect x="190" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="205" y="25" fill="#64748B" font-family="sans-serif" font-size="11">ACTIVE CRONS</text>
    <text x="205" y="52" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="bold">18 Schedules</text>
    <text x="205" y="68" fill="#3B82F6" font-family="sans-serif" font-size="10">Next run in 2m 14s</text>

    <rect x="380" width="180" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="395" y="25" fill="#64748B" font-family="sans-serif" font-size="11">DB HEALTH</text>
    <text x="395" y="52" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="bold">0 Overhead</text>
    <text x="395" y="68" fill="#10B981" font-family="sans-serif" font-size="10">InnoDB engine verified</text>
  </g>

  <!-- Action Deck Table -->
  <rect x="20" y="190" width="560" height="165" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="20" y="190" width="560" height="32" fill="#F8FAFC" rx="6 6 0 0"/>
  <text x="35" y="211" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">RAPID ACTIONS</text>
  <text x="380" y="211" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">EXECUTION</text>

  <text x="35" y="245" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="500">Flush All Object &amp; Transient Caches</text>
  <rect x="380" y="230" width="90" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="398" y="246" fill="#0F172A" font-family="sans-serif" font-size="11">Flush Now</text>

  <line x1="20" y1="265" x2="580" y2="265" stroke="#F1F5F9" stroke-width="1"/>

  <text x="35" y="290" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="500">Clean Autoloaded Options (&gt;800KB items)</text>
  <rect x="380" y="275" width="90" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="403" y="291" fill="#0F172A" font-family="sans-serif" font-size="11">Optimize</text>

  <line x1="20" y1="310" x2="580" y2="310" stroke="#F1F5F9" stroke-width="1"/>

  <text x="35" y="335" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="500">Emergency Maintenance Mode Toggle</text>
  <rect x="380" y="320" width="90" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="395" y="336" fill="#DC2626" font-family="sans-serif" font-size="11">OFF (Toggle)</text>
</svg>