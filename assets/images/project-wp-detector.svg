<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1e36" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas with Subtle Ambient Glow -->
  <rect width="1024" height="640" fill="url(#bg-glow)"/>

  <!-- Main Window Frame (Centered, 16:10 Ratio) -->
  <g transform="translate(184, 60)">
    <!-- Outer Window Card -->
    <rect width="656" height="520" rx="10" fill="#0d1424" stroke="#1f2d47" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M0,10 Q0,0 10,0 L646,0 Q656,0 656,10 L656,44 L0,44 Z" fill="#0b101d"/>
    <line x1="0" y1="44" x2="656" y2="44" stroke="#162136" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="22" r="5" fill="#EF4444"/>
    <circle cx="36" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="22" r="5" fill="#10B981"/>

    <!-- Address Bar -->
    <rect x="74" y="11" width="562" height="24" rx="4" fill="#070a13" stroke="#1e2a40" stroke-width="1"/>
    <path d="M88,24 L94,24 L94,20 C94,18.3 92.7,17 91,17 C89.3,17 88,18.3 88,20 Z M86,24 L96,24 L96,29 L86,29 Z" fill="#F59E0B"/>
    <text x="104" y="27" fill="#CBD5E1" font-family="monospace, sans-serif" font-size="11">https://www.nasa.gov/</text>

    <!-- Tool Header Row -->
    <g transform="translate(20, 58)">
      <circle cx="20" cy="20" r="16" fill="#2563EB"/>
      <!-- Mountain / Bridge icon -->
      <path d="M12,28 L17,16 L23,25 L28,14 L32,28 Z" fill="#FFFFFF"/>
      <text x="46" y="18" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">WP Stack Report <tspan fill="#64748B" font-weight="normal" font-size="11">Diagnostics Tool</tspan></text>
      <text x="46" y="32" fill="#38BDF8" font-family="monospace, sans-serif" font-size="10">Scanning: https://www.nasa.gov/</text>

      <!-- Right action buttons -->
      <g transform="translate(516, 8)">
        <rect x="0" y="0" width="22" height="22" rx="4" fill="#131d31" stroke="#223250" stroke-width="1"/>
        <text x="6" y="15" fill="#94A3B8" font-size="11">↻</text>
        <rect x="28" y="0" width="22" height="22" rx="4" fill="#131d31" stroke="#223250" stroke-width="1"/>
        <text x="34" y="15" fill="#94A3B8" font-size="11">⎘</text>
        <rect x="56" y="0" width="22" height="22" rx="4" fill="#131d31" stroke="#223250" stroke-width="1"/>
        <text x="62" y="15" fill="#94A3B8" font-size="11">↓</text>
        <rect x="84" y="0" width="22" height="22" rx="4" fill="#131d31" stroke="#223250" stroke-width="1"/>
        <text x="89" y="15" fill="#94A3B8" font-size="11">&lt;&gt;</text>
      </g>
    </g>

    <!-- 3 Summary Badges Strip -->
    <g transform="translate(20, 108)">
      <rect width="616" height="44" rx="6" fill="#0c1322" stroke="#19243a" stroke-width="1"/>
      <!-- Badge 1: STATUS -->
      <g transform="translate(18, 10)">
        <circle cx="6" cy="12" r="4" fill="#10B981" filter="url(#glow)"/>
        <text x="16" y="8" fill="#64748B" font-family="sans-serif" font-size="8" font-weight="bold" letter-spacing="1">STATUS</text>
        <text x="16" y="21" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">Active</text>
      </g>
      <line x1="180" y1="8" x2="180" y2="36" stroke="#162136" stroke-width="1"/>

      <!-- Badge 2: CORE VERSION -->
      <g transform="translate(200, 10)">
        <circle cx="10" cy="12" r="9" fill="#1e2e4a"/>
        <text x="26" y="8" fill="#64748B" font-family="sans-serif" font-size="8" font-weight="bold" letter-spacing="1">CORE VERSION</text>
        <text x="26" y="21" fill="#38BDF8" font-family="monospace, sans-serif" font-size="11" font-weight="bold">v7.0.7</text>
      </g>
      <line x1="380" y1="8" x2="380" y2="36" stroke="#162136" stroke-width="1"/>

      <!-- Badge 3: PLUGINS -->
      <g transform="translate(400, 10)">
        <circle cx="10" cy="12" r="9" fill="#2a1d40"/>
        <text x="26" y="8" fill="#64748B" font-family="sans-serif" font-size="8" font-weight="bold" letter-spacing="1">PLUGINS</text>
        <text x="26" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">28 Active</text>
      </g>
    </g>

    <!-- Main Two-Column View -->
    <!-- LEFT COLUMN: Theme & Server -->
    <g transform="translate(20, 162)">
      <!-- Card 1: Environment & Theme -->
      <rect width="296" height="154" rx="6" fill="#0d1526" stroke="#19243a" stroke-width="1"/>
      <!-- Header -->
      <rect width="296" height="28" rx="6" fill="#111a2f"/>
      <circle cx="16" cy="14" r="6" fill="#2563EB"/>
      <text x="28" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">WordPress Environment &amp; Theme</text>

      <!-- Row 1: Site URL -->
      <text x="14" y="46" fill="#64748B" font-family="sans-serif" font-size="9">Site URL</text>
      <text x="160" y="46" fill="#38BDF8" font-family="monospace, sans-serif" font-size="9">https://www.nasa.gov/</text>

      <!-- Row 2: HTTPS -->
      <text x="14" y="72" fill="#64748B" font-family="sans-serif" font-size="9">HTTPS</text>
      <rect x="210" y="60" width="74" height="16" rx="3" fill="#10B981" fill-opacity="0.15"/>
      <text x="216" y="72" fill="#34D399" font-family="sans-serif" font-size="8" font-weight="bold">✓ Passed (TLS)</text>

      <!-- Row 3: Active Theme -->
      <text x="14" y="98" fill="#64748B" font-family="sans-serif" font-size="9">Active Theme</text>
      <text x="212" y="98" fill="#38BDF8" font-family="monospace, sans-serif" font-size="10" font-weight="bold">nasa</text>
      <rect x="240" y="88" width="44" height="14" rx="2" fill="#1e293b"/>
      <text x="244" y="98" fill="#94A3B8" font-family="sans-serif" font-size="7">Unknown</text>

      <!-- Row 4: Environment Type -->
      <text x="14" y="126" fill="#64748B" font-family="sans-serif" font-size="9">Environment Type</text>
      <text x="180" y="126" fill="#E2E8F0" font-family="sans-serif" font-size="9" font-weight="500">Frontend Extracted</text>

      <!-- Card 2: Server, Proxy & DNS -->
      <g transform="translate(0, 166)">
        <rect width="296" height="174" rx="6" fill="#0d1526" stroke="#19243a" stroke-width="1"/>
        <rect width="296" height="28" rx="6" fill="#111a2f"/>
        <rect x="10" y="8" width="12" height="12" rx="2" fill="#059669"/>
        <text x="28" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">Server, Proxy &amp; DNS</text>

        <text x="14" y="46" fill="#64748B" font-family="sans-serif" font-size="9">Proxy / CDN</text>
        <rect x="210" y="36" width="74" height="14" rx="2" fill="#1e293b"/>
        <text x="218" y="46" fill="#94A3B8" font-family="sans-serif" font-size="8">None Detected</text>

        <text x="14" y="72" fill="#64748B" font-family="sans-serif" font-size="9">Web Server</text>
        <text x="250" y="72" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="9" font-weight="bold">nginx</text>

        <text x="14" y="98" fill="#64748B" font-family="sans-serif" font-size="9">PHP Version</text>
        <rect x="234" y="88" width="50" height="14" rx="2" fill="#1e293b"/>
        <text x="242" y="98" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown</text>

        <text x="14" y="124" fill="#64748B" font-family="sans-serif" font-size="9">Host IP (A Record)</text>
        <text x="212" y="124" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="9" font-weight="bold">192.0.66.108</text>

        <text x="14" y="150" fill="#64748B" font-family="sans-serif" font-size="9">Nameservers</text>
        <text x="206" y="146" fill="#94A3B8" font-family="monospace, sans-serif" font-size="8">a12-64.akam.net</text>
        <text x="206" y="158" fill="#94A3B8" font-family="monospace, sans-serif" font-size="8">a5-66.akam.net</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: Plugin Inventory (28) -->
    <g transform="translate(328, 162)">
      <rect width="308" height="340" rx="6" fill="#0d1526" stroke="#19243a" stroke-width="1"/>
      <!-- Header -->
      <rect width="308" height="28" rx="6" fill="#111a2f"/>
      <circle cx="16" cy="14" r="6" fill="#7C3AED"/>
      <text x="28" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">Plugin Inventory (28)</text>

      <!-- Search Input -->
      <rect x="12" y="36" width="284" height="24" rx="4" fill="#080d17" stroke="#1d293d" stroke-width="1"/>
      <text x="24" y="52" fill="#475569" font-family="sans-serif" font-size="9">🔍  Search detected plugins...</text>

      <!-- Plugin Row 1: popup-maker -->
      <g transform="translate(12, 68)">
        <rect width="284" height="36" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="18" r="8" fill="#7C3AED" fill-opacity="0.4"/>
        <text x="30" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">popup-maker</text>
        <text x="30" y="28" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v1.18.4</text>
        <rect x="232" y="10" width="44" height="16" rx="2" fill="#1e293b"/>
        <text x="236" y="21" fill="#94A3B8" font-family="sans-serif" font-size="7">Unknown ›</text>
      </g>

      <!-- Plugin Row 2: gravityforms -->
      <g transform="translate(12, 110)">
        <rect width="284" height="36" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="18" r="8" fill="#7C3AED" fill-opacity="0.4"/>
        <text x="30" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">gravityforms</text>
        <text x="30" y="28" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v2.8.6</text>
        <rect x="232" y="10" width="44" height="16" rx="2" fill="#1e293b"/>
        <text x="236" y="21" fill="#94A3B8" font-family="sans-serif" font-size="7">Unknown ›</text>
      </g>

      <!-- Plugin Row 3: nasa-blocks -->
      <g transform="translate(12, 152)">
        <rect width="284" height="36" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="18" r="8" fill="#7C3AED" fill-opacity="0.4"/>
        <text x="30" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">nasa-blocks</text>
        <text x="30" y="28" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v1.2.0</text>
        <rect x="232" y="10" width="44" height="16" rx="2" fill="#1e293b"/>
        <text x="236" y="21" fill="#94A3B8" font-family="sans-serif" font-size="7">Unknown ›</text>
      </g>

      <!-- Plugin Row 4: wp-parsely -->
      <g transform="translate(12, 194)">
        <rect width="284" height="36" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="18" r="8" fill="#0284C7" fill-opacity="0.4"/>
        <text x="30" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">wp-parsely</text>
        <text x="30" y="28" fill="#64748B" font-family="monospace, sans-serif" font-size="8">vecf94842061bea03d54b</text>
        <rect x="232" y="10" width="44" height="16" rx="2" fill="#1e293b"/>
        <text x="236" y="21" fill="#94A3B8" font-family="sans-serif" font-size="7">Unknown ›</text>
      </g>

      <!-- Plugin Row 5: accessibility-checker -->
      <g transform="translate(12, 236)">
        <rect width="284" height="36" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="18" r="8" fill="#059669" fill-opacity="0.4"/>
        <text x="30" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">accessibility-checker</text>
        <text x="30" y="28" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v1.49.0</text>
        <rect x="232" y="10" width="44" height="16" rx="2" fill="#1e293b"/>
        <text x="236" y="21" fill="#94A3B8" font-family="sans-serif" font-size="7">Unknown ›</text>
      </g>

      <!-- Bottom Note Box -->
      <g transform="translate(12, 280)">
        <rect width="284" height="44" rx="4" fill="#0b111e" stroke="#162136" stroke-width="1"/>
        <circle cx="14" cy="22" r="6" fill="#1E3A8A"/>
        <text x="12" y="25" fill="#38BDF8" font-size="9" font-weight="bold">i</text>
        <text x="26" y="18" fill="#64748B" font-family="sans-serif" font-size="8">Note: Only plugins with public assets or REST</text>
        <text x="26" y="30" fill="#64748B" font-family="sans-serif" font-size="8">API endpoints can be detected.</text>
      </g>
    </g>
  </g>
</svg>