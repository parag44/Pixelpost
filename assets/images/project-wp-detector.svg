<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <rect width="600" height="375" fill="#17191E"/>
  <!-- Browser Frame Header -->
  <rect width="600" height="38" fill="#1F232B"/>
  <circle cx="20" cy="19" r="5" fill="#EF4444"/>
  <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="19" r="5" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="75" y="8" width="360" height="22" rx="4" fill="#121418" stroke="#2D3342" stroke-width="1"/>
  <text x="88" y="23" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">https://client-site.com</text>
  
  <!-- Extension Action Icon / Pill -->
  <rect x="450" y="8" width="130" height="22" rx="4" fill="#A94F20" fill-opacity="0.2" stroke="#A94F20" stroke-width="1"/>
  <circle cx="464" cy="19" r="5" fill="#A94F20"/>
  <text x="476" y="23" fill="#FB923C" font-family="sans-serif" font-size="10" font-weight="bold">WP Detector</text>

  <!-- Chrome Extension Popup Modal (Centered Floating Card) -->
  <g transform="translate(85, 48)">
    <!-- Popup Background & Border -->
    <rect width="430" height="285" rx="8" fill="#1C2028" stroke="#2E3646" stroke-width="1.5"/>
    <rect width="430" height="285" rx="8" fill="none" stroke="#A94F20" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Popup Header Bar -->
    <path d="M0,8 Q0,0 8,0 L422,0 Q430,0 430,8 L430,42 L0,42 Z" fill="#222733"/>
    <line x1="0" y1="42" x2="430" y2="42" stroke="#2D3545" stroke-width="1"/>
    
    <!-- Logo & Title -->
    <circle cx="26" cy="21" r="11" fill="#A94F20"/>
    <text x="21" y="26" fill="#FFFFFF" font-family="Georgia, serif" font-size="13" font-weight="bold">W</text>
    <text x="44" y="25" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">WP Detector</text>
    <text x="132" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">Chrome Extension</text>
    
    <!-- Verified Badge -->
    <rect x="316" y="11" width="100" height="20" rx="3" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1"/>
    <circle cx="326" cy="21" r="3" fill="#34D399"/>
    <text x="335" y="25" fill="#34D399" font-family="monospace, sans-serif" font-size="9" font-weight="bold">WORDPRESS 6.7</text>

    <!-- Main Content Grid -->
    <!-- 1. WordPress Core & Theme Section -->
    <g transform="translate(16, 54)">
      <rect width="398" height="62" rx="5" fill="#171A21" stroke="#262C3A" stroke-width="1"/>
      <!-- Theme Info -->
      <text x="14" y="20" fill="#A94F20" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">ACTIVE THEME</text>
      <text x="14" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Astra Pro <tspan fill="#94A3B8" font-size="11" font-weight="normal">v4.8.2 · Child Theme Active</tspan></text>
      <text x="14" y="54" fill="#64748B" font-family="monospace, sans-serif" font-size="9">Author: Brainstorm Force · /wp-content/themes/astra-child/</text>

      <rect x="320" y="12" width="66" height="20" rx="3" fill="#A94F20" fill-opacity="0.2"/>
      <text x="328" y="26" fill="#FB923C" font-family="monospace, sans-serif" font-size="9" font-weight="bold">PARENT: OK</text>
    </g>

    <!-- 2. Detected Plugins Section -->
    <g transform="translate(16, 126)">
      <text x="0" y="12" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">DETECTED PLUGINS (6 DISCOVERED)</text>
      
      <!-- Plugin Tag Badges -->
      <g transform="translate(0, 20)">
        <!-- Badge 1: WooCommerce -->
        <rect x="0" y="0" width="124" height="28" rx="4" fill="#222733" stroke="#2E3646" stroke-width="1"/>
        <circle cx="12" cy="14" r="4" fill="#A855F7"/>
        <text x="22" y="18" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="500">WooCommerce 9.3</text>

        <!-- Badge 2: ACF Pro -->
        <rect x="132" y="0" width="120" height="28" rx="4" fill="#222733" stroke="#2E3646" stroke-width="1"/>
        <circle cx="144" cy="14" r="4" fill="#38BDF8"/>
        <text x="154" y="18" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="500">ACF Pro v6.3.8</text>

        <!-- Badge 3: LiteSpeed Cache -->
        <rect x="260" y="0" width="138" height="28" rx="4" fill="#222733" stroke="#2E3646" stroke-width="1"/>
        <circle cx="272" cy="14" r="4" fill="#10B981"/>
        <text x="282" y="18" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="500">LiteSpeed Cache 6.5</text>
      </g>

      <g transform="translate(0, 54)">
        <!-- Badge 4: Elementor -->
        <rect x="0" y="0" width="124" height="28" rx="4" fill="#222733" stroke="#2E3646" stroke-width="1"/>
        <circle cx="12" cy="14" r="4" fill="#EC4899"/>
        <text x="22" y="18" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="500">Elementor Core</text>

        <!-- Badge 5: Yoast SEO -->
        <rect x="132" y="0" width="120" height="28" rx="4" fill="#222733" stroke="#2E3646" stroke-width="1"/>
        <circle cx="144" cy="14" r="4" fill="#F59E0B"/>
        <text x="154" y="18" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="500">Yoast SEO v23.5</text>

        <!-- Badge 6: WPForms -->
        <rect x="260" y="0" width="138" height="28" rx="4" fill="#222733" stroke="#2E3646" stroke-width="1"/>
        <circle cx="272" cy="14" r="4" fill="#FB923C"/>
        <text x="282" y="18" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="500">WPForms Lite</text>
      </g>
    </g>

    <!-- 3. Server & Infrastructure Bar -->
    <g transform="translate(16, 224)">
      <rect width="398" height="44" rx="4" fill="#171A21" stroke="#262C3A" stroke-width="1"/>
      <text x="14" y="18" fill="#64748B" font-family="monospace, sans-serif" font-size="9" font-weight="bold">SERVER &amp; CACHE</text>
      <text x="14" y="33" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">LiteSpeed / HTTP3 · PHP 8.2 · Cloudflare CDN</text>

      <rect x="306" y="10" width="80" height="24" rx="3" fill="#A94F20"/>
      <text x="320" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">CWS Live</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <rect y="346" width="600" height="29" fill="#1F232B"/>
  <text x="20" y="365" fill="#94A3B8" font-family="monospace, sans-serif" font-size="10">Chrome Web Store Extension · One-Click Full Stack Detection · By Parag Das</text>
</svg>