<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0e192d" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#080c16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05080f" stop-opacity="1"/>
    </radialGradient>

    <!-- App Icon Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Outer Window Drop Shadow -->
    <filter id="window-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#020408" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0e2246" flood-opacity="0.25" />
    </filter>

    <!-- Active Status Glow -->
    <filter id="green-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1024" height="640" fill="url(#bg-glow)"/>

  <!-- ========================================================
       CENTERED MAIN BROWSER / POPUP WINDOW (X: 184, Y: 68)
       ======================================================== -->
  <g transform="translate(184, 68)" filter="url(#window-shadow)">
    <!-- Window Outer Shell -->
    <rect width="656" height="504" rx="10" fill="#0A101D" stroke="#192438" stroke-width="1.5"/>

    <!-- Window Titlebar Header (Height: 40px) -->
    <path d="M0,10 Q0,0 10,0 L646,0 Q656,0 656,10 L656,40 L0,40 Z" fill="#080C16"/>
    <line x1="0" y1="40" x2="656" y2="40" stroke="#141D2D" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="22" cy="20" r="5" fill="#FF5F56"/>
    <circle cx="37" cy="20" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="20" r="5" fill="#27C93F"/>

    <!-- Address Bar (Centered) -->
    <g transform="translate(72, 8)">
      <rect width="568" height="24" rx="5" fill="#05080E" stroke="#192334" stroke-width="1"/>
      <!-- Gold Lock Icon -->
      <path d="M16,13 L18,13 L18,11 C18,9.9 17.1,9 16,9 C14.9,9 14,9.9 14,11 L14,13 L16,13 Z M12.5,13 L19.5,13 L19.5,17 L12.5,17 Z" fill="#F59E0B"/>
      <text x="28" y="16.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://www.nasa.gov/</text>
    </g>

    <!-- ========================================================
         EXTENSION BODY
         ======================================================== -->
    <!-- Extension Top Header Row (Y: 52) -->
    <g transform="translate(18, 52)">
      <!-- Blue App Logo Icon (Two peaks) -->
      <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#icon-grad)"/>
      <path d="M9,22 L13,12 L17,19 L20,10 L24,22 Z" fill="#FFFFFF"/>

      <!-- Title & Scanning subtitle -->
      <text x="40" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">WP Stack Report <tspan fill="#64748B" font-size="10.5" font-weight="normal">Diagnostics Tool</tspan></text>
      <text x="40" y="27" fill="#38BDF8" font-family="monospace, sans-serif" font-size="9.5">🌐 Scanning: https://www.nasa.gov/</text>

      <!-- 4 Quick Actions (Refresh, Copy, Download, Code) -->
      <g transform="translate(516, 5)">
        <rect x="0" y="0" width="22" height="22" rx="4" fill="#0D1524" stroke="#19253A" stroke-width="1"/>
        <text x="5" y="15" fill="#94A3B8" font-family="sans-serif" font-size="12">↻</text>
        <rect x="26" y="0" width="22" height="22" rx="4" fill="#0D1524" stroke="#19253A" stroke-width="1"/>
        <text x="31" y="15" fill="#94A3B8" font-family="sans-serif" font-size="11">⎘</text>
        <rect x="52" y="0" width="22" height="22" rx="4" fill="#0D1524" stroke="#19253A" stroke-width="1"/>
        <text x="58" y="15" fill="#94A3B8" font-family="sans-serif" font-size="11">↓</text>
        <rect x="78" y="0" width="22" height="22" rx="4" fill="#0D1524" stroke="#19253A" stroke-width="1"/>
        <text x="82" y="15" fill="#94A3B8" font-family="monospace, sans-serif" font-size="10">&lt;&gt;</text>
      </g>
    </g>

    <!-- 3 Summary Badges Strip (Y: 96, Height: 44px) -->
    <g transform="translate(18, 96)">
      <rect width="620" height="44" rx="6" fill="#080E1B" stroke="#141E30" stroke-width="1"/>
      
      <!-- Metric 1: STATUS Active -->
      <g transform="translate(16, 9)">
        <circle cx="8" cy="14" r="4" fill="#10B981" filter="url(#green-glow)"/>
        <text x="20" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1">STATUS</text>
        <text x="20" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Active</text>
      </g>
      <line x1="190" y1="8" x2="190" y2="36" stroke="#141E30" stroke-width="1"/>

      <!-- Metric 2: CORE VERSION v7.0.7 -->
      <g transform="translate(206, 9)">
        <circle cx="14" cy="14" r="10" fill="#111C30"/>
        <path d="M8,18 L11,11 L14,16 L17,9 L20,18 Z" fill="#38BDF8"/>
        <text x="32" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1">CORE VERSION</text>
        <text x="32" y="24" fill="#38BDF8" font-family="monospace, sans-serif" font-size="12" font-weight="bold">v7.0.7</text>
      </g>
      <line x1="395" y1="8" x2="395" y2="36" stroke="#141E30" stroke-width="1"/>

      <!-- Metric 3: PLUGINS 28 Active -->
      <g transform="translate(412, 9)">
        <!-- Puzzle icon -->
        <rect x="6" y="6" width="14" height="14" rx="2" fill="#1E1630"/>
        <path d="M10,6 L10,8 C11,8 11.5,8.5 11.5,9 C11.5,9.5 11,10 10,10 L10,13 L13,13 C13,12 13.5,11.5 14,11.5 C14.5,11.5 15,12 15,13 L18,13 L18,18 L13,18 L13,16 C13,15 12.5,14.5 12,14.5 C11.5,14.5 11,15 11,16 L11,18 L6,18 L6,13 L8,13 C9,13 9.5,12.5 9.5,12 C9.5,11.5 9,11 8,11 L6,11 L6,6 Z" fill="#A855F7" transform="scale(0.85) translate(4, 3)"/>
        <text x="30" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1">PLUGINS</text>
        <text x="30" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">28 Active</text>
      </g>
    </g>

    <!-- ========================================================
         TWO COLUMN CARDS (Y: 150)
         ======================================================== -->
    <!-- LEFT COLUMN: Theme & Server (Width: 302px) -->
    <g transform="translate(18, 150)">
      <!-- Card 1: WordPress Environment & Theme (Height: 144px) -->
      <rect width="302" height="144" rx="6" fill="#0B111F" stroke="#162136" stroke-width="1"/>
      <!-- Header -->
      <circle cx="17" cy="15" r="7" fill="#1E3A8A"/>
      <text x="13" y="19" fill="#38BDF8" font-size="9">🌐</text>
      <text x="30" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">WordPress Environment &amp; Theme</text>
      <text x="285" y="19" fill="#64748B" font-size="9">⌃</text>
      <line x1="12" y1="30" x2="290" y2="30" stroke="#121B2C" stroke-width="1"/>

      <!-- Row 1: Site URL -->
      <g transform="translate(12, 48)">
        <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Site URL</text>
        <text x="150" fill="#38BDF8" font-family="monospace, sans-serif" font-size="9.5">🔗 https://www.nasa.gov/ ↗</text>
      </g>

      <!-- Row 2: HTTPS -->
      <g transform="translate(12, 75)">
        <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">HTTPS</text>
        <rect x="204" y="-11" width="74" height="16" rx="3" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3" stroke-width="0.5"/>
        <text x="212" y="1" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold">✓ Passed (TLS)</text>
      </g>

      <!-- Row 3: Active Theme -->
      <g transform="translate(12, 102)">
        <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Active Theme</text>
        <text x="194" fill="#38BDF8" font-family="monospace, sans-serif" font-size="10" font-weight="bold">nasa</text>
        <rect x="228" y="-10" width="50" height="14" rx="2" fill="#182338"/>
        <text x="234" y="1" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown</text>
      </g>

      <!-- Row 4: Environment Type -->
      <g transform="translate(12, 128)">
        <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Environment Type</text>
        <text x="178" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold">Frontend Extracted</text>
      </g>

      <!-- Card 2: Server, Proxy & DNS (Height: 184px, Y: 154) -->
      <g transform="translate(0, 154)">
        <rect width="302" height="184" rx="6" fill="#0B111F" stroke="#162136" stroke-width="1"/>
        <rect x="10" y="8" width="14" height="14" rx="3" fill="#065F46"/>
        <text x="13" y="19" fill="#34D399" font-size="9">▤</text>
        <text x="30" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">Server, Proxy &amp; DNS</text>
        <text x="285" y="19" fill="#64748B" font-size="9">⌃</text>
        <line x1="12" y1="30" x2="290" y2="30" stroke="#121B2C" stroke-width="1"/>

        <!-- Row 1: Proxy / CDN -->
        <g transform="translate(12, 48)">
          <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Proxy / CDN</text>
          <rect x="204" y="-10" width="74" height="15" rx="2" fill="#182338"/>
          <text x="212" y="1" fill="#94A3B8" font-family="sans-serif" font-size="8">None Detected</text>
        </g>

        <!-- Row 2: Web Server -->
        <g transform="translate(12, 75)">
          <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Web Server</text>
          <text x="246" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="10" font-weight="bold">nginx</text>
        </g>

        <!-- Row 3: PHP Version -->
        <g transform="translate(12, 102)">
          <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">PHP Version</text>
          <rect x="228" y="-10" width="50" height="15" rx="2" fill="#182338"/>
          <text x="234" y="1" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown</text>
        </g>

        <!-- Row 4: Host IP -->
        <g transform="translate(12, 129)">
          <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Host IP (A Record)</text>
          <text x="202" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="10" font-weight="bold">192.0.66.108</text>
        </g>

        <!-- Row 5: Nameservers -->
        <g transform="translate(12, 156)">
          <text fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Nameservers</text>
          <text x="194" fill="#94A3B8" font-family="monospace, sans-serif" font-size="9">a12-64.akam.net</text>
          <text x="194" y="13" fill="#94A3B8" font-family="monospace, sans-serif" font-size="9">a5-66.akam.net</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: Plugin Inventory (28) (Width: 308px, Height: 338px) -->
    <g transform="translate(330, 150)">
      <rect width="308" height="338" rx="6" fill="#0B111F" stroke="#162136" stroke-width="1"/>
      <!-- Header -->
      <circle cx="17" cy="15" r="7" fill="#581C87"/>
      <text x="13" y="18" fill="#C084FC" font-size="9">🧩</text>
      <text x="30" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">Plugin Inventory (28)</text>
      <text x="290" y="19" fill="#64748B" font-size="9">⌃</text>
      <line x1="12" y1="30" x2="296" y2="30" stroke="#121B2C" stroke-width="1"/>

      <!-- Search Input -->
      <g transform="translate(12, 38)">
        <rect width="284" height="22" rx="4" fill="#060911" stroke="#162238" stroke-width="1"/>
        <text x="10" y="15" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">🔍  Search detected plugins...</text>
      </g>

      <!-- Plugin 1: popup-maker -->
      <g transform="translate(12, 68)">
        <rect width="284" height="34" rx="4" fill="#080E1B" stroke="#141E30" stroke-width="1"/>
        <rect x="8" y="7" width="20" height="20" rx="4" fill="#3B1F54"/>
        <text x="13" y="21" fill="#D8B4FE" font-size="9">🧩</text>
        <text x="34" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold">popup-maker</text>
        <text x="34" y="27" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v1.18.4</text>
        <rect x="228" y="9" width="48" height="16" rx="3" fill="#162238"/>
        <text x="233" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown ›</text>
      </g>

      <!-- Plugin 2: gravityforms -->
      <g transform="translate(12, 108)">
        <rect width="284" height="34" rx="4" fill="#080E1B" stroke="#141E30" stroke-width="1"/>
        <rect x="8" y="7" width="20" height="20" rx="4" fill="#3B1F54"/>
        <text x="13" y="21" fill="#D8B4FE" font-size="9">🧩</text>
        <text x="34" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold">gravityforms</text>
        <text x="34" y="27" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v2.8.6</text>
        <rect x="228" y="9" width="48" height="16" rx="3" fill="#162238"/>
        <text x="233" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown ›</text>
      </g>

      <!-- Plugin 3: nasa-blocks -->
      <g transform="translate(12, 148)">
        <rect width="284" height="34" rx="4" fill="#080E1B" stroke="#141E30" stroke-width="1"/>
        <rect x="8" y="7" width="20" height="20" rx="4" fill="#3B1F54"/>
        <text x="13" y="21" fill="#D8B4FE" font-size="9">🧩</text>
        <text x="34" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold">nasa-blocks</text>
        <text x="34" y="27" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v1.2.0</text>
        <rect x="228" y="9" width="48" height="16" rx="3" fill="#162238"/>
        <text x="233" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown ›</text>
      </g>

      <!-- Plugin 4: wp-parsely -->
      <g transform="translate(12, 188)">
        <rect width="284" height="34" rx="4" fill="#080E1B" stroke="#141E30" stroke-width="1"/>
        <rect x="8" y="7" width="20" height="20" rx="4" fill="#0369A1"/>
        <text x="13" y="21" fill="#BAE6FD" font-size="9">📊</text>
        <text x="34" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold">wp-parsely</text>
        <text x="34" y="27" fill="#64748B" font-family="monospace, sans-serif" font-size="8">vecf94842061bea03d54b</text>
        <rect x="228" y="9" width="48" height="16" rx="3" fill="#162238"/>
        <text x="233" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown ›</text>
      </g>

      <!-- Plugin 5: accessibility-checker -->
      <g transform="translate(12, 228)">
        <rect width="284" height="34" rx="4" fill="#080E1B" stroke="#141E30" stroke-width="1"/>
        <rect x="8" y="7" width="20" height="20" rx="4" fill="#047857"/>
        <text x="13" y="21" fill="#A7F3D0" font-size="9">🛡</text>
        <text x="34" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold">accessibility-checker</text>
        <text x="34" y="27" fill="#64748B" font-family="monospace, sans-serif" font-size="8">v1.49.0</text>
        <rect x="228" y="9" width="48" height="16" rx="3" fill="#162238"/>
        <text x="233" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8">Unknown ›</text>
      </g>

      <!-- Bottom Info Callout Box -->
      <g transform="translate(12, 276)">
        <rect width="284" height="48" rx="5" fill="#070D18" stroke="#141F32" stroke-width="1"/>
        <circle cx="16" cy="24" r="6" fill="#1E3A8A"/>
        <text x="14" y="27" fill="#38BDF8" font-family="serif" font-size="9" font-weight="bold">i</text>
        <text x="28" y="20" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Note: Only plugins with public assets or REST API</text>
        <text x="28" y="32" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">endpoints can be detected.</text>
      </g>
    </g>
  </g>
</svg>